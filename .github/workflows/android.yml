name: Android

on:
  push:
    branches: [dev, main]
    # A.T.L.A.S. changes do not build or sign a new Android package.
    paths-ignore:
      - 'tools/waypoint-discord-bot/**'
      - '.github/workflows/discord-ticket-issue.yml'
      - '.github/workflows/android.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  # Keep main's exact-commit artifact available to the release workflow.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: 00 / Trailhead · Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 scripts/check_repo_hygiene.py
      - name: Check version and release notes
        run: python3 scripts/check_version.py

  workflow_safety:
    name: 01A / North gate · Workflow safety
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax with actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Audit workflow security with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: v1.32.0

  dependency_review:
    name: 01B / Toll gate · Dependency review
    if: github.event_name == 'pull_request'
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review new dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  route_model:
    name: 01C / Route map · CI gate tests
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test branch-specific blocking gates and route summary
        run: python3 -m unittest discover -s scripts -p 'test_ci_summary.py' -v

  release_page:
    name: 01D / Atlas room · Release page
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release page structure and local assets
        run: python3 scripts/check_release_page.py
      - name: Test release page contract
        run: python3 -m unittest discover -s scripts -p 'test_release_page.py' -v

  styles:
    name: 02A / Cartography wing · Map styles
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/style-validation/package-lock.json
      - name: Validate all MapLibre styles
        run: |
          npm ci --prefix tools/style-validation
          node scripts/validate_styles.cjs

  assets:
    name: 02B / Icon depot · Map assets
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate map assets and generated icon atlases
        run: |
          python3 -m venv "$RUNNER_TEMP/map-assets-venv"
          PYTHON="$RUNNER_TEMP/map-assets-venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check -r tools/imagegen/requirements.txt
          "$PYTHON" -m unittest discover -s scripts -p 'test_validate_map_assets.py' -v
          "$PYTHON" scripts/validate_map_assets.py
          "$PYTHON" scripts/import_imagegen_poi_cell_repairs.py --check
          "$PYTHON" scripts/check_style_parity.py nier night_city
          "$PYTHON" scripts/generate_night_city_icons.py --check

  motion:
    name: 02C / Signal line · Motion source
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/waypoint-motion/package-lock.json
      - name: Lint editable motion source
        run: |
          npm ci --prefix tools/waypoint-motion
          npm run lint --prefix tools/waypoint-motion
      - name: Check motion dependencies for moderate-or-higher advisories
        run: npm audit --prefix tools/waypoint-motion --audit-level=moderate

  android:
    name: 03A / Entry ramp · Debug APK
    needs: [repository, release_page, styles, assets, motion]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/dev' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify packaged component boundaries
        run: python3 scripts/check_packaged_manifest.py debug
      - name: Save debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waypoint-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android_unit:
    name: 03B / Street grid · JVM tests
    needs: [repository, route_model]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/dev' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run JVM regression tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Save JVM test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  android_lint:
    name: 03C / Clearances · Android lint
    needs: [repository, workflow_safety, styles]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/dev' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Save lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  release_candidate:
    name: 04A / Release loop · Release preflight
    needs: [workflow_safety, release_page, assets, motion, android, android_unit, android_lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/dev' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build release variant and run release tests and lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Verify release package and legacy updater size
        run: |
          python3 scripts/check_packaged_manifest.py release
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$release_apk" || { echo 'Release preflight did not produce an APK'; exit 1; }
          python3 scripts/check_update_size.py "$release_apk"
      - name: Save release preflight reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preflight-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

  device_smoke:
    name: 04B / Field station · Navigation emulator
    needs: [android, android_unit, styles, assets]
    # Ubuntu 26 runners intermittently lose the emulator's package service.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise cursor, orientation, offline places, car and security contracts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        with:
          api-level: 35
          arch: x86_64
          # Mesa avoids the legacy SwiftShader GLES compiler's Filament shader failures.
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.waypoint.app.SecurityConfigurationTest,com.waypoint.app.QuestRepositoryTest,com.waypoint.app.CarSessionTest,com.waypoint.app.CursorModelRenderingTest,com.waypoint.app.MapOrientationTest,com.waypoint.app.places.OfflinePlacesStoreTest,com.waypoint.app.SearchAliasStorageTest
      - name: Save device-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  sign:
    name: 05A / Signing vault · Signed APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflow_safety, release_page, styles, assets, motion, android, android_unit, android_lint, release_candidate, device_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check version and release notes
        run: python3 scripts/check_version.py
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Android signing secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waypoint.keystore"
          chmod 600 "$RUNNER_TEMP/waypoint.keystore"
      - name: Build signed release
        env:
          WAYPOINT_KEYSTORE: ${{ runner.temp }}/waypoint.keystore
          WAYPOINT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and package APK
        run: |
          python3 scripts/check_packaged_manifest.py release
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Waypoint.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release/Waypoint.apk
          python3 scripts/check_update_size.py release/Waypoint.apk
          cd release
          sha256sum Waypoint.apk > SHA256SUMS
      - name: Save signed APK for release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waypoint-signed-apk
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/waypoint.keystore"

  attest:
    name: 05B / Provenance bridge · APK attestation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Waypoint-signed-apk
          path: release
      - name: Attest APK build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/Waypoint.apk

  ci_tree:
    name: 06 / Route ledger · Blocking summary
    if: always()
    needs: [repository, workflow_safety, dependency_review, route_model, release_page, styles, assets, motion, android, android_unit, android_lint, release_candidate, device_smoke, sign, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draw the route map and enforce required gates
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci_summary.py
